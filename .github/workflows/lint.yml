name: lint
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml

  lint:
    needs: changes
    # Run even if classification failed; only an explicit "false" skips.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_lint.yml
    with:
      run: ${{ needs.changes.outputs.code != 'false' }}
