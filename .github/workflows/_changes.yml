name: changes

# Reports whether a pull request changes anything the code checks look at.
# Pushes, schedules and manual runs always count as code, so main and the
# nightly security scan run in full.
on:
  workflow_call:
    outputs:
      code:
        description: '"true" unless every changed path is prose (see scripts/ci-code-changed.sh)'
        value: ${{ jobs.classify.outputs.code }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit, whose first parent
          # is the base, so two commits are enough to diff against it.
          fetch-depth: 2
          persist-credentials: false
      - id: classify
        run: |
          if [ "$EVENT" != pull_request ]; then
            code=true
          else
            # --no-renames lists both sides of a move, so moving code into
            # docs/ still counts as a code change.
            code=$(git diff --no-renames --name-only HEAD^1 HEAD | scripts/ci-code-changed.sh)
          fi
          echo "Code changed: $code"
          echo "code=$code" >>"$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
