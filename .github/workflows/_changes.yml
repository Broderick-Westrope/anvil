name: changes

# Reports whether a pull request changes anything the code checks look at.
# Only a pull request into the default branch can skip: pushes, schedules
# and manual runs always count as code, so main and the nightly security
# scan run in full. Stacked pull requests always run in full too, because
# retargeting one to main changes what it merges without a new run.
#
# Callers skip work only when the output is exactly "false". If this
# workflow fails, the output is empty and the checks run.
on:
  workflow_call:
    outputs:
      code:
        description: '"false" only when every change is prose (see scripts/ci-code-changed.sh)'
        value: ${{ jobs.classify.outputs.code }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit, whose first parent
          # is the base, so two commits are enough to diff against it.
          fetch-depth: 2
          persist-credentials: false
      - run: scripts/ci-code-changed_test.sh
      - id: classify
        run: |
          if [ "$EVENT" != pull_request ] || [ "$BASE" != "$DEFAULT_BRANCH" ]; then
            code=true
          else
            # --no-renames lists both sides of a move, so moving code into
            # docs/ still counts as a code change. --raw carries file modes,
            # so a symlink or executable never counts as prose.
            code=$(git diff --no-renames --raw HEAD^1 HEAD | scripts/ci-code-changed.sh)
          fi
          echo "Code changed: $code"
          echo "code=$code" >>"$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
