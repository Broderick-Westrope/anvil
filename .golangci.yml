version: "2"
linters:
  enable:
    - bodyclose
    - depguard
    # - exhaustive
    # - goconst
    - gocognit
    # - godot
    # - godox
    # - gomoddirectives
    - goprintffuncname
    # - gosec
    - misspell
    # - nakedret
    # - nestif
    # - nilerr
    - noctx
    - nolintlint
    # - prealloc
    # - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    # - unconvert
    # - unparam
    - whitespace
    # - wrapcheck
  settings:
    # Layers, top to bottom: cmd, ui, workspace, app, agent, then everything
    # else in internal/. A package may import its own layer or any layer
    # below it. See "Package Layers" in AGENTS.md.
    depguard:
      rules:
        core:
          files:
            - "**/internal/**"
            - "!**/internal/agent/**"
            - "!**/internal/app/**"
            - "!**/internal/workspace/**"
            - "!**/internal/ui/**"
            - "!**/internal/cmd/**"
            - "!**/internal/testutil/**"
          deny:
            - pkg: github.com/Broderick-Westrope/anvil/internal/agent
              desc: core packages sit below the agent layer
            - pkg: github.com/Broderick-Westrope/anvil/internal/app
              desc: core packages sit below the app layer
            - pkg: github.com/Broderick-Westrope/anvil/internal/workspace
              desc: core packages sit below the workspace layer
            - pkg: github.com/Broderick-Westrope/anvil/internal/ui
              desc: core packages sit below the ui layer
            - pkg: github.com/Broderick-Westrope/anvil/internal/cmd
              desc: only main imports cmd
        agent:
          files:
            - "**/internal/agent/**"
          deny:
            - pkg: github.com/Broderick-Westrope/anvil/internal/app
              desc: agent sits below the app layer
            - pkg: github.com/Broderick-Westrope/anvil/internal/workspace
              desc: agent sits below the workspace layer
            - pkg: github.com/Broderick-Westrope/anvil/internal/ui
              desc: agent sits below the ui layer
            - pkg: github.com/Broderick-Westrope/anvil/internal/cmd
              desc: only main imports cmd
        app:
          files:
            - "**/internal/app/**"
          deny:
            - pkg: github.com/Broderick-Westrope/anvil/internal/workspace
              desc: app sits below the workspace layer
            - pkg: github.com/Broderick-Westrope/anvil/internal/ui
              desc: app sits below the ui layer
            - pkg: github.com/Broderick-Westrope/anvil/internal/cmd
              desc: only main imports cmd
        workspace:
          files:
            - "**/internal/workspace/**"
          deny:
            - pkg: github.com/Broderick-Westrope/anvil/internal/ui
              desc: workspace sits below the ui layer
            - pkg: github.com/Broderick-Westrope/anvil/internal/cmd
              desc: only main imports cmd
        ui:
          files:
            - "**/internal/ui/**"
          deny:
            - pkg: github.com/Broderick-Westrope/anvil/internal/cmd
              desc: only main imports cmd
    gocognit:
      min-complexity: 30
  disable:
    - errcheck
    - ineffassign
    - unused
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      - path: _test\.go
        linters: [gocognit]
      # Functions over the gocognit limit when it was enabled. Each new
      # function must stay under it. Delete an entry once its function is
      # back under the limit.
      - path: internal/agent/agent\.go
        text: 'func `(\(\*sessionAgent\)\.generateTitle|\(\*sessionAgent\)\.preparePrompt|\(\*sessionAgent\)\.summarizeOwned)`'
        linters: [gocognit]
      - path: internal/agent/tools/anvil_info\.go
        text: 'func `(writeLSP|writeMCP)`'
        linters: [gocognit]
      - path: internal/agent/tools/anvil_logs\.go
        text: 'func `(readLastLines)`'
        linters: [gocognit]
      - path: internal/agent/tools/bash\.go
        text: 'func `(newBashTool)`'
        linters: [gocognit]
      - path: internal/agent/tools/download\.go
        text: 'func `(NewDownloadTool)`'
        linters: [gocognit]
      - path: internal/agent/tools/fetch\.go
        text: 'func `(NewFetchTool)`'
        linters: [gocognit]
      - path: internal/agent/tools/grep\.go
        text: 'func `(NewGrepTool)`'
        linters: [gocognit]
      - path: internal/agent/tools/job_output\.go
        text: 'func `(NewJobOutputTool)`'
        linters: [gocognit]
      - path: internal/agent/tools/lsp_call_hierarchy\.go
        text: 'func `(NewCallHierarchyTool)`'
        linters: [gocognit]
      - path: internal/agent/tools/lsp_rename\.go
        text: 'func `(NewRenameTool)`'
        linters: [gocognit]
      - path: internal/agent/tools/search\.go
        text: 'func `(parseLiteSearchResults)`'
        linters: [gocognit]
      - path: internal/agent/tools/todos\.go
        text: 'func `(NewTodosTool)`'
        linters: [gocognit]
      - path: internal/agent/tools/view\.go
        text: 'func `(runPathMode)`'
        linters: [gocognit]
      - path: internal/agent/tools/write\.go
        text: 'func `(NewWriteTool)`'
        linters: [gocognit]
      - path: internal/app/app\.go
        text: 'func `(\(\*App\)\.RunNonInteractive)`'
        linters: [gocognit]
      - path: internal/app/memlog\.go
        text: 'func `(\(\*App\)\.startMemoryMonitor)`'
        linters: [gocognit]
      - path: internal/ui/anim/anim\.go
        text: 'func `(New)`'
        linters: [gocognit]
      - path: internal/ui/chat/docker_mcp\.go
        text: 'func `(\(\*DockerMCPToolRenderContext\)\.RenderTool)`'
        linters: [gocognit]
      - path: internal/ui/chat/todos\.go
        text: 'func `(\(\*TodosToolRenderContext\)\.RenderTool)`'
        linters: [gocognit]
      - path: internal/ui/chat/tools\.go
        text: 'func `(\(\*baseToolMessageItem\)\.formatParametersForCopy)`'
        linters: [gocognit]
      - path: internal/ui/chat/unified_diff\.go
        text: 'func `(parseUnifiedDiff)`'
        linters: [gocognit]
      - path: internal/ui/dialog/commands\.go
        text: 'func `(\(\*Commands\)\.defaultCommands|\(\*Commands\)\.HandleMsg)`'
        linters: [gocognit]
      - path: internal/ui/dialog/mcp_palette\.go
        text: 'func `(\(\*MCPPalette\)\.handleNavKey)`'
        linters: [gocognit]
      - path: internal/ui/dialog/models\.go
        text: 'func `(\(\*Models\)\.setProviderItems)`'
        linters: [gocognit]
      - path: internal/ui/dialog/sessions\.go
        text: 'func `(\(\*Session\)\.HandleMsg)`'
        linters: [gocognit]
      - path: internal/ui/dialog/tree\.go
        text: 'func `(NewTree)`'
        linters: [gocognit]
      - path: internal/ui/diffview/diffview\.go
        text: 'func `(\(\*DiffView\)\.renderSplit|\(\*DiffView\)\.renderUnified)`'
        linters: [gocognit]
      - path: internal/ui/list/highlight\.go
        text: 'func `(HighlightBuffer)`'
        linters: [gocognit]
      - path: internal/ui/model/sidebar\.go
        text: 'func `(\(\*UI\)\.modelInfo)`'
        linters: [gocognit]
      - path: internal/ui/model/ui\.go
        text: 'func `(\(\*UI\)\.appendSessionMessageToChat|\(\*UI\)\.deriveEnabledLazyMCPs|\(\*UI\)\.Draw|\(\*UI\)\.FullHelp|\(\*UI\)\.handleChildSessionMessage|\(\*UI\)\.handleDialogMsg|\(\*UI\)\.handleKeyPressMsg|\(\*UI\)\.loadNestedToolCalls|\(\*UI\)\.update|\(\*UI\)\.updateSessionMessageToChat)`'
        linters: [gocognit]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
