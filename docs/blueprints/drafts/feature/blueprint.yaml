name: feature
description: >
  End-to-end feature implementation: grill requirements, think before coding,
  plan, execute with preflight gates, dual-model review with finding verification,
  human-assisted PR review, and post-mortem.
argument-hint: "<feature-description> [--spec=path] [--plan=path]"
invocation: user

fragments:
  preflight-and-commit:
    source: fragments/preflight-and-commit.yaml

steps:
  # ── Grill ───────────────────────────────────────────────────────────
  # Interactive, multi-turn. The agent explores the codebase, asks
  # questions one-at-a-time, builds shared understanding, and writes
  # the design spec to disk.

  - name: grill
    type: interactive
    skill: grilling
    output: spec_path

  - name: spec-review
    type: agentic
    agent: devils-advocate
    input: "{{ spec_path }}"

  - name: approve-spec
    type: interactive
    prompt: |
      Spec written to {{ spec_path }}. Review and approve to proceed.
    gate: user-approval

  # ── Pre-Implementation Thinking ─────────────────────────────────────
  # The human thinks independently BEFORE seeing agent analysis.
  # Once the human provides notes, the agent compares against its own
  # codebase exploration and surfaces gaps. Merged output feeds planning.

  - name: pre-impl-thinking
    type: interactive
    reference: references/pre-impl-thinking.md
    input: "{{ spec_path }}"
    output: human_notes

  - name: pre-impl-compare
    type: agentic
    reference: references/pre-impl-compare.md
    input:
      - "{{ spec_path }}"
      - "{{ human_notes }}"
    output: pre_impl_notes

  # ── Plan ────────────────────────────────────────────────────────────
  # Produces an implementation plan with tasks grouped by subsystem.
  # Uses merged pre-impl output to populate Patterns & Constraints.

  - name: plan
    type: agentic
    skill: writing-plans
    input:
      - "{{ spec_path }}"
      - "{{ pre_impl_notes }}"
    tools: [view, ls, grep, glob, write, task]
    output: plan_path
    skip-if: "{{ args.plan }}"

  - name: approve-plan
    type: interactive
    prompt: |
      Plan written to {{ plan_path }}. Review and approve to proceed.
    gate: user-approval

  # ── Execute ─────────────────────────────────────────────────────────
  # Parse the plan into task groups, then loop: implement each group,
  # run preflight checks, commit. Fix-up commits are separate.

  - name: parse-groups
    type: agentic
    prompt: >
      Read the plan at {{ plan_path }}. Extract the task groups
      (sections under ## headings). Output a structured list with
      each group's name, tasks, and relevant file paths.
    input: "{{ plan_path }}"
    output: task_groups

  - name: implement-group
    type: agentic
    loop:
      over: "{{ task_groups }}"
      as: group
    agent: fixer
    input: "{{ group }}"

  - uses: preflight-and-commit
    loop:
      over: "{{ task_groups }}"
      as: group
    with:
      commit_message: "{{ group.name }}"

  # ── Review ──────────────────────────────────────────────────────────
  # Dual-model code review. Sonnet for speed/breadth, Opus for
  # depth/nuance. Findings are deduplicated using merge rules.

  - name: generate-diff
    type: deterministic
    bash: git diff main...HEAD
    output: diff

  - name: review
    type: parallel
    nodes:
      - agent: code-reviewer-sonnet
        input: "{{ diff }}"
      - agent: code-reviewer-opus
        input: "{{ diff }}"
    reference: references/review-merge-rules.md
    output: review_findings

  # ── Verify Findings ─────────────────────────────────────────────────
  # The verifier audits each review finding against the actual codebase.
  # Only verified findings proceed to the fix step.

  - name: verify-findings
    type: agentic
    agent: verifier
    reference: references/finding-verification.md
    input: "{{ review_findings }}"
    output: verified_findings

  # ── Fix Verified Findings ───────────────────────────────────────────

  - name: fix-findings
    type: agentic
    condition: "{{ verified_findings.verified_count }} > 0"
    prompt: >
      Fix the verified issues listed below. Address each one, keeping
      changes focused and minimal.
    input: "{{ verified_findings }}"

  - name: fix-review-preflight
    type: gate
    condition: "{{ verified_findings.verified_count }} > 0"
    skill: preflight-checks
    critical: true

  - name: fix-review-commit
    type: deterministic
    condition: "{{ verified_findings.verified_count }} > 0"
    bash: git add -A && git commit -m "fix: address review findings"

  # ── Ship ────────────────────────────────────────────────────────────

  - name: generate-pr-description
    type: agentic
    prompt: >
      Generate a PR title and body for the changes on this branch.
      Summarize what was implemented and why, referencing the spec
      and plan. Output as YAML with keys: title, body.
    input:
      - "{{ spec_path }}"
      - "{{ plan_path }}"
      - "{{ diff }}"
    output: pr_description

  - name: draft-pr
    type: deterministic
    bash: |
      gh pr create --draft \
        --title "{{ pr_description.title }}" \
        --body "{{ pr_description.body }}"
    output: pr_url

  # ── Human Review ────────────────────────────────────────────────────
  # Blueprint exits to conversational mode. The user reviews in VS Code
  # (GitHub PR extension). Agent stays available for questions and fixes.

  - name: human-review
    type: interactive
    prompt: |
      Draft PR is up at {{ pr_url }}.
      Review in VS Code — I'm here for questions or small fixes.
      When you're done, say "ready" to continue.

  - name: mark-ready
    type: deterministic
    bash: gh pr ready {{ pr_url }}

  # ── Watch CI ────────────────────────────────────────────────────────
  # Optional. Watches PR checks and retries on failure.

  - name: watch-ci
    type: gate
    condition: user-requests
    bash: gh pr checks {{ pr_url }} --watch
    critical: true
    retry:
      max: 3
      skill: ci-fix

  # ── Post-Mortem ─────────────────────────────────────────────────────
  # Always runs. Proportional to complexity.

  - name: post-mortem
    type: agentic
    skill: post-mortem
