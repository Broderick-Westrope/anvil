name: feature
description: >
  End-to-end feature implementation: grill requirements, think before coding,
  plan, execute with preflight gates, dual-model review with finding verification,
  human-assisted PR review, and post-mortem.
argument-hint: "<feature-description> [--spec=path] [--plan=path]"
invocation: user

steps:
  # ── Grill ───────────────────────────────────────────────────────────
  # Interactive, multi-turn. The agent explores the codebase, asks
  # questions one-at-a-time, and builds shared understanding.

  - name: grill
    type: interactive
    skill: grilling
    output: spec_draft

  - name: write-spec
    type: agentic
    input: "{{ spec_draft }}"
    output: spec_path

  - name: spec-review
    type: agentic
    agent: devils-advocate
    input: "{{ spec_path }}"
    retry: { max: 3 }

  - name: approve-spec
    type: interactive
    prompt: |
      Spec written to {{ spec_path }}. Review and approve to proceed.
    gate: user-approval

  # ── Pre-Implementation Thinking ─────────────────────────────────────
  # The human thinks independently BEFORE seeing agent analysis.
  # Once the human provides notes, the agent compares against its own
  # codebase exploration and surfaces gaps. Merged output feeds planning.

  - name: pre-impl-thinking
    type: interactive
    reference: references/pre-impl-thinking.md
    input: "{{ spec_path }}"
    output: pre_impl_notes

  # ── Plan ────────────────────────────────────────────────────────────
  # Produces an implementation plan with tasks grouped by subsystem.
  # Uses merged pre-impl output to populate Patterns & Constraints.

  - name: plan
    type: agentic
    skill: writing-plans
    input:
      - "{{ spec_path }}"
      - "{{ pre_impl_notes }}"
    tools: [view, ls, grep, glob, write, task]
    output: plan_path
    gate: user-approval
    skip-if: user-requests

  # ── Execute ─────────────────────────────────────────────────────────
  # Runs the plan. The executing-plans skill handles task grouping,
  # subagent dispatch, and auto-recovery internally.

  - name: implement
    type: agentic
    skill: executing-plans
    input: "{{ plan_path }}"

  # Per task group: preflight, commit, fix if needed, commit fix.
  # These steps repeat for each task group produced by executing-plans.
  # Commits tell a story — fix-up commits are separate, not squashed.

  - name: preflight
    type: gate
    skill: preflight-checks
    repeat: per-task-group
    critical: false

  - name: commit
    type: deterministic
    repeat: per-task-group
    bash: git add -A && git commit -m "{{ task_group_message }}"

  - name: fix-preflight
    type: agentic
    repeat: per-task-group
    condition: preflight failed
    skill: systematic-debugging
    retry: { max: 2 }

  - name: preflight-rerun
    type: gate
    repeat: per-task-group
    condition: fixes were made
    skill: preflight-checks
    critical: true

  - name: commit-fix
    type: deterministic
    repeat: per-task-group
    condition: fixes were made
    bash: git add -A && git commit -m "fix: {{ preflight_fix_message }}"

  # ── Review ──────────────────────────────────────────────────────────
  # Dual-model code review. Sonnet for speed/breadth, Opus for
  # depth/nuance. Findings are deduplicated using merge rules.

  - name: review
    type: parallel
    nodes:
      - agent: code-reviewer-sonnet
        input: "{{ diff }}"
      - agent: code-reviewer-opus
        input: "{{ diff }}"
    reference: references/review-merge-rules.md
    output: review_findings

  # ── Verify Findings ─────────────────────────────────────────────────
  # The verifier audits each review finding against the actual codebase.
  # Only verified findings proceed to the fix step.

  - name: verify-findings
    type: agentic
    agent: verifier
    input: "{{ review_findings }}"
    reference: references/finding-verification.md
    output: verified_findings

  # ── Fix Verified Findings ───────────────────────────────────────────

  - name: fix-findings
    type: agentic
    condition: verified_findings has items marked verified
    input: "{{ verified_findings }}"

  - name: fix-preflight
    type: gate
    condition: verified_findings has items marked verified
    skill: preflight-checks
    critical: true

  - name: fix-commit
    type: deterministic
    condition: verified_findings has items marked verified
    bash: git add -A && git commit -m "fix: address review findings"

  # ── Ship ────────────────────────────────────────────────────────────

  - name: draft-pr
    type: deterministic
    bash: |
      gh pr create --draft \
        --title "{{ pr_title }}" \
        --body "{{ pr_body }}"
    output: pr_url

  # ── Human Review ────────────────────────────────────────────────────
  # Blueprint exits to conversational mode. The user reviews in VS Code
  # (GitHub PR extension). Agent stays available for questions and fixes.

  - name: human-review
    type: interactive
    prompt: |
      Draft PR is up at {{ pr_url }}.
      Review in VS Code — I'm here for questions or small fixes.
      When you're done, say "ready" to continue.

  - name: mark-ready
    type: deterministic
    bash: gh pr ready {{ pr_url }}

  # ── Watch CI ────────────────────────────────────────────────────────
  # Optional. Watches PR checks and retries on failure.

  - name: watch-ci
    type: deterministic
    condition: user-requests
    bash: gh pr checks {{ pr_url }} --watch

  - name: ci-fix
    type: agentic
    condition: ci failed
    skill: systematic-debugging
    input: "{{ ci_failure_output }}"
    retry: { max: 3 }

  - name: ci-push
    type: deterministic
    condition: ci fixes made
    bash: git push

  - name: ci-rewatch
    type: deterministic
    condition: ci fixes made
    bash: gh pr checks {{ pr_url }} --watch

  # ── Post-Mortem ─────────────────────────────────────────────────────
  # Always runs. Proportional to complexity.

  - name: post-mortem
    type: agentic
    skill: post-mortem
